name: etf-theme-radar

services:
  api:
    build:
      context: .
      target: api
    env_file:
      - path: deploy/.env.production
        required: false
    environment:
      DATABASE_PATH: /app/data/radar.db
      EMBEDDED_WORKERS_ENABLED: "false"
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://127.0.0.1:8080}
      PUBLIC_FRONTEND_URL: ${PUBLIC_FRONTEND_URL:-http://127.0.0.1:8080}
    volumes:
      - radar_data:/app/data
    expose:
      - "8001"
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:8001/health', timeout=3).status == 200"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

  worker:
    build:
      context: .
      target: api
    env_file:
      - path: deploy/.env.production
        required: false
    environment:
      DATABASE_PATH: /app/data/radar.db
      EMBEDDED_WORKERS_ENABLED: "false"
    volumes:
      - radar_data:/app/data
    command: ["python", "-m", "etf_theme_radar.production_worker"]
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: .
      target: frontend
    environment:
      RADAR_BACKEND_URL: http://api:8001
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_started
    expose:
      - "3000"
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

  caddy:
    image: caddy:2.10-alpine
    depends_on:
      frontend:
        condition: service_healthy
    ports:
      # Safe default: expose only to a local VPN, tunnel, or company gateway.
      - "${RADAR_HTTP_BIND:-127.0.0.1}:${RADAR_HTTP_PORT:-8080}:80"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  backup:
    build:
      context: .
      target: api
    profiles: ["maintenance"]
    user: "0:0"
    volumes:
      - radar_data:/app/data:ro
      - ./backups:/backups
    entrypoint: ["python", "/usr/local/bin/backup_sqlite.py"]
    command: ["--source", "/app/data/radar.db", "--destination-dir", "/backups"]

  restore:
    build:
      context: .
      target: api
    profiles: ["maintenance"]
    user: "0:0"
    volumes:
      - radar_data:/app/data
      - ./backups:/backups:ro
    entrypoint: ["python", "/usr/local/bin/restore_sqlite.py"]

volumes:
  radar_data:
  caddy_data:
  caddy_config:
